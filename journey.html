<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,powerPreference:'high-performance'});
let dpr=Math.min(devicePixelRatio||1,1.5);renderer.setPixelRatio(dpr);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const Door=(()=>{
'use strict';

const FOV = 42;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 1.0, 150);
const world = new THREE.Group();
scene.add(world);

let seed = 90210;
function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
const V3 = THREE.Vector3;

const LDEF = [
  {p:[0,5.0,0],      c:[0.45,0.85,1.00], i:7.0},
  {p:[3.2,2.6,2.2],  c:[1.00,0.22,0.65], i:3.2},
  {p:[-3.2,2.4,-2.4],c:[0.15,0.75,1.00], i:3.2},
  {p:[-2.6,2.0,3.2], c:[0.55,0.35,1.00], i:2.6},
  {p:[0,8.1,0],      c:[0.80,0.90,1.00], i:3.0},
  {p:[ 7.78,3.5, 7.78], c:[0.75,0.88,1.0], i:5.0},
  {p:[-7.78,3.5, 7.78], c:[0.75,0.88,1.0], i:5.0},
  {p:[ 7.78,3.5,-7.78], c:[0.75,0.88,1.0], i:5.0},
  {p:[-7.78,3.5,-7.78], c:[0.75,0.88,1.0], i:5.0},
  {p:[0,0.5,0],      c:[0.20,0.80,1.00], i:2.0}
];

const U = {
  uTime:{value:0}, uCam:{value:new V3()}, uFlip:{value:1}, uRes:{value:new THREE.Vector2(1,1)},
  uLP:{value:LDEF.map(l=>new V3(l.p[0],l.p[1],l.p[2]))},
  uLC:{value:LDEF.map(l=>new V3(l.c[0]*l.i,l.c[1]*l.i,l.c[2]*l.i))},
  tOpaque:{value:null}, tRefl:{value:null},
  uRain:{value:75.0}, uSimple:{value:0}, uScale:{value:800}
};

const COMMON = `
uniform float uTime;
uniform vec3 uCam;
uniform float uFlip;
uniform vec3 uLP[10];
uniform vec3 uLC[10];
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(h12(i), h12(i+vec2(1.0,0.0)), f.x), mix(h12(i+vec2(0.0,1.0)), h12(i+vec2(1.0,1.0)), f.x), f.y);
}
float fbm(vec2 p){ float a=0.5,s=0.0; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+vec2(11.7,3.1); a*=0.5; } return s; }

void shade(vec3 p, vec3 n, vec3 v, float shin, out vec3 diff, out vec3 spec){
  diff = vec3(0.0); spec = vec3(0.0);
  for(int i=0;i<10;i++){
    vec3 d = uLP[i] - p; float d2 = dot(d,d); vec3 l = d*inversesqrt(d2);
    float att = 1.0/(1.0 + d2*0.08);
    float nl = max(dot(n,l), 0.0);
    diff += uLC[i]*nl*att;
    vec3 h = normalize(l + v);
    spec += uLC[i]*pow(max(dot(n,h), 0.0), shin)*att*nl;
  }
}
vec3 envNight(vec3 d){
  vec3 c = vec3(0.003,0.006,0.013);
  c += vec3(0.03,0.06,0.12)*pow(clamp(d.y,0.0,1.0), 0.6);
  float a = atan(d.x, d.z);
  float band = pow(max(1.0 - abs(d.y - 0.10)*7.0, 0.0), 2.0);
  c += band*mix(vec3(0.05,0.5,0.9), vec3(0.9,0.2,0.6), 0.5 + 0.5*sin(a*3.0 + uTime*0.15))*0.45;
  c += vec3(0.7,0.85,1.0)*pow(max(dot(d, normalize(vec3(-0.45,0.8,0.35))), 0.0), 40.0)*2.5;
  c += vec3(1.0,0.3,0.7)*pow(max(dot(d, normalize(vec3(0.75,0.25,-0.55))), 0.0), 50.0)*2.2;
  c += vec3(0.3,0.7,1.0)*pow(max(dot(d, normalize(vec3(0.1,0.3,0.99))), 0.0), 60.0)*2.0;
  return c;
}
`;

const propMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `
    attribute vec3 color; attribute float emis;
    varying vec3 vW; varying vec3 vN; varying vec3 vC; varying float vE;
    void main(){
      vec4 wp = modelMatrix*vec4(position,1.0);
      vW = wp.xyz; vN = normalize(mat3(modelMatrix)*normal); vC = color; vE = emis;
      gl_Position = projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader: COMMON + `
    varying vec3 vW; varying vec3 vN; varying vec3 vC; varying float vE;
    void main(){
      vec3 op = vec3(vW.x, vW.y*uFlip, vW.z);
      vec3 n = normalize(vec3(vN.x, vN.y*uFlip, vN.z));
      vec3 v = normalize(uCam - op);
      vec3 dl, sp; shade(op, n, v, 48.0, dl, sp);
      vec3 amb = vec3(0.010,0.018,0.034)*(0.6 + 0.4*(n.y*0.5 + 0.5));
      vec3 c = vC*(amb + dl*0.45) + sp*0.35;
      float F = 0.04 + 0.96*pow(1.0 - max(dot(n,v),0.0), 5.0);
      c += envNight(reflect(-v, n))*F*0.7;
      c += vC*vE;
      gl_FragColor = vec4(c, 1.0);
    }`
});

const glassMat = new THREE.ShaderMaterial({
  uniforms: U, side: THREE.DoubleSide, transparent:true, depthWrite:false,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
  blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
  vertexShader: `
    varying vec3 vW; varying vec3 vN;
    void main(){
      vec4 wp = modelMatrix*vec4(position,1.0);
      vW = wp.xyz; vN = normalize(mat3(modelMatrix)*normal);
      gl_Position = projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader: COMMON + `
    uniform float uRain; uniform sampler2D tOpaque; uniform vec2 uRes; uniform float uSimple;
    varying vec3 vW; varying vec3 vN;
    void drops(vec2 p, float sc, float sd, out vec2 nrm, out float mk){
      vec2 g = p*sc; vec2 id = floor(g); vec2 f = fract(g) - 0.5;
      float h = h12(id + sd);
      float on = step(0.45, h);
      float sp = 0.015 + 0.035*h;
      float cy = 0.28 - 0.56*fract(uTime*sp + h*9.0);
      vec2 c = vec2((h22(id + sd + 3.0) - 0.5)*0.4, cy);
      float r = 0.07 + 0.08*h12(id + sd + 9.0);
      vec2 d = (f - c)*vec2(1.0, 1.15);
      float dd = length(d);
      float body = smoothstep(r, r*0.55, dd);
      float trail = smoothstep(0.018, 0.0, abs(f.x - c.x))*step(f.y, 0.30)*step(c.y, f.y)*0.35*step(0.55, h);
      mk = (body + trail)*on;
      nrm = (d/r)*body*on;
    }
    void main(){
      vec3 op = vec3(vW.x, vW.y*uFlip, vW.z);
      vec3 n = normalize(vec3(vN.x, vN.y*uFlip, vN.z));
      vec3 v = normalize(uCam - op);
      if(dot(n,v) < 0.0) n = -n;
      float ndv = clamp(dot(n,v), 0.0, 1.0);
      float F = 0.04 + 0.96*pow(1.0 - ndv, 5.0);

      vec3 tg = (abs(n.y) > 0.92) ? vec3(1.0,0.0,0.0) : normalize(vec3(-n.z, 0.0, n.x));
      vec3 bt = normalize(cross(n, tg)); if(bt.y < 0.0) bt = -bt;
      vec2 p2 = vec2(dot(op, tg), dot(op, bt));
      vec2 n1, n2; float m1, m2;
      drops(p2, 2.2, 0.0, n1, m1);
      drops(p2 + vec2(3.7,1.3), 5.0, 17.0, n2, m2);
      vec2 dn = n1 + n2*0.7;
      float mk = max(m1, m2*0.8) * clamp(uRain, 0.0, 1.0);
      vec3 wn = (tg*dn.x + bt*dn.y) * clamp(uRain, 0.0, 1.0);
      vec3 nw = normalize(n + wn*0.9);

      vec3 dl, sp; shade(op, nw, v, 220.0, dl, sp);
      vec3 rd = reflect(-v, nw);
      vec3 add = envNight(rd)*(F + 0.03)*1.4 + sp*1.2 + vec3(0.10,0.40,0.75)*pow(1.0 - ndv, 3.0)*0.35;

      vec3 refr = vec3(0.0); float at = 0.12;
      if(uSimple < 0.5){
        vec2 suv = gl_FragCoord.xy/uRes;
        vec3 vv = mat3(viewMatrix)*wn;
        vec2 off = -vv.xy*0.05 + (vec2(fbm(op.xy*1.3 + op.z), fbm(op.zy*1.3 + op.x)) - 0.5)*0.003;
        refr.r = texture2D(tOpaque, clamp(suv + off*1.00, 0.001, 0.999)).r;
        refr.g = texture2D(tOpaque, clamp(suv + off*1.07, 0.001, 0.999)).g;
        refr.b = texture2D(tOpaque, clamp(suv + off*1.14, 0.001, 0.999)).b;
        refr *= vec3(0.80,0.92,1.0)*0.95;
        at = 0.80 + 0.12*mk;
      }
      gl_FragColor = vec4(refr*at + add, at);
    }`
});

const floorMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `varying vec3 vW; void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vW = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; }`,
  fragmentShader: COMMON + `
    uniform sampler2D tRefl; uniform vec2 uRes; uniform float uRain;
    varying vec3 vW;
    void ripples(vec2 p, out vec2 grad, out float ring){
      grad = vec2(0.0); ring = 0.0;
      for(int L=0; L<2; L++){
        float sc = (L==0) ? 1.1 : 0.7;
        vec2 g = p/sc; vec2 id = floor(g); vec2 f = fract(g) - 0.5;
        float h = h12(id + float(L)*31.7);
        vec2 c = (h22(id + float(L)*7.3) - 0.5)*0.3;
        float ph = fract(uTime*(0.55 + 0.3*h) + h*7.0);
        vec2 d = f - c; float r = length(d);
        float R = ph*0.42;
        float w = exp(-pow((r - R)/0.035, 2.0));
        float amp = (1.0 - ph)*(1.0 - ph)*step(0.35, h)*uRain;
        ring += w*amp;
        grad += normalize(d + vec2(1e-4))*w*amp;
      }
    }
    void main(){
      vec3 op = vW; float r = length(op.xz);
      vec3 n = vec3(0.0,1.0,0.0); vec3 v = normalize(uCam - op);
      float oct = max(max(abs(op.x), abs(op.z)), (abs(op.x) + abs(op.z))*0.70711);
      float inside = 1.0 - smoothstep(5.55, 5.62, oct);

      vec2 q = op.xz/3.0; vec2 id = floor(q); vec2 f = fract(q);
      float gr = smoothstep(0.0, 0.012, min(min(f.x,1.0-f.x), min(f.y,1.0-f.y)));
      vec3 outA = vec3(0.020,0.024,0.030)*(0.7 + 0.6*h12(id))*(0.8 + 0.4*fbm(op.xz*2.0))*mix(0.4, 1.0, gr);
      vec2 q2 = op.xz/1.2; vec2 id2 = floor(q2); vec2 f2 = fract(q2);
      float gr2 = smoothstep(0.0, 0.02, min(min(f2.x,1.0-f2.x), min(f2.y,1.0-f2.y)));
      vec3 inA = mix(vec3(0.60,0.64,0.70), vec3(0.42,0.47,0.55), mod(id2.x + id2.y, 2.0))*mix(0.5,1.0,gr2)*(0.85 + 0.3*h12(id2));
      vec3 alb = mix(outA, inA, inside);
      float rough = mix(0.55, 0.2, inside);

      vec2 rg; float ring; ripples(op.xz, rg, ring);
      rg *= (1.0 - inside);
      ring *= (1.0 - inside);

      vec3 dl, sp; shade(op, n, v, 90.0, dl, sp);
      vec3 amb = vec3(0.008,0.014,0.026);
      vec3 c = alb*(amb + dl*0.6) + sp*mix(0.5, 0.25, inside);

      vec2 suv = gl_FragCoord.xy/uRes;
      vec2 duv = rg*0.012 + (vec2(fbm(op.xz*3.0), fbm(op.xz*3.0 + 7.0)) - 0.5)*0.004*rough;
      float blurY = 0.003 + 0.010*rough;
      vec3 refl = vec3(0.0); float ws = 0.0;
      for(int i=-3; i<=3; i++){
        float w = exp(-float(i*i)*0.25);
        refl += texture2D(tRefl, clamp(suv + duv + vec2(0.0, float(i)*blurY), 0.001, 0.999)).rgb*w; ws += w;
      }
      refl /= ws;
      float ndv = max(dot(n,v), 0.0);
      float F = 0.04 + 0.96*pow(1.0 - ndv, 5.0);
      float k = mix(0.25, 1.0, F)*mix(0.9, 0.55, inside*0.5);
      c += refl*k;
      c += vec3(0.6,0.8,1.0)*ring*0.35;

      float ang = atan(op.z, op.x);
      float ring1 = smoothstep(0.06, 0.0, abs(r - 9.6));
      float ring2 = smoothstep(0.04, 0.0, abs(r - 13.2))*0.6;
      float da = abs(fract(ang/0.785398 - 0.5) - 0.5)*0.785398;
      float spoke = smoothstep(0.05, 0.0, r*da)*step(6.4, r)*step(r, 9.6);
      float pulse = 0.8 + 0.2*sin(uTime*0.8 - r*0.6);
      c += (ring1*vec3(0.15,0.75,1.0)*2.2 + ring2*vec3(0.9,0.25,0.7)*1.6 + spoke*vec3(0.2,0.6,1.0)*0.9)*pulse*(1.0 - inside);

      float fade = 1.0 - smoothstep(13.5, 25.0, r);
      gl_FragColor = vec4(c*fade, 1.0);
    }`
});

const lightsMat = new THREE.ShaderMaterial({
  uniforms: U, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader: `
    attribute float aSize; attribute vec3 aCol; attribute float aPh; attribute float aMove;
    uniform float uTime; uniform float uScale;
    varying vec3 vCol;
    void main(){
      vec3 pp = position + aMove*vec3(sin(uTime*0.4 + aPh*20.0), sin(uTime*0.5 + aPh*13.0)*0.5, cos(uTime*0.3 + aPh*17.0))*0.6;
      vec4 mv = viewMatrix*modelMatrix*vec4(pp,1.0);
      float fl = 0.85 + 0.15*sin(uTime*(1.2 + aPh*2.0) + aPh*40.0);
      float dist = -mv.z;
      gl_PointSize = min(aSize*fl*uScale/max(dist,0.1), 160.0);
      vCol = aCol*fl;
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: `
    varying vec3 vCol;
    void main(){
      float d = length(gl_PointCoord - 0.5)*2.0;
      float a = exp(-d*d*4.5)*step(d, 1.0);
      gl_FragColor = vec4(vCol, a);
    }`
});

const coneMat = new THREE.ShaderMaterial({
  uniforms: U, transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending,
  vertexShader: `
    varying vec3 vW; varying vec3 vN; varying vec2 vUv;
    void main(){ vUv = uv; vec4 wp = modelMatrix*vec4(position,1.0); vW = wp.xyz; vN = normalize(mat3(modelMatrix)*normal); gl_Position = projectionMatrix*viewMatrix*wp; }`,
  fragmentShader: COMMON + `
    varying vec3 vW; varying vec3 vN; varying vec2 vUv;
    void main(){
      vec3 op = vec3(vW.x, vW.y*uFlip, vW.z);
      vec3 n = normalize(vec3(vN.x, vN.y*uFlip, vN.z));
      vec3 v = normalize(uCam - op);
      float e = pow(abs(dot(n,v)), 1.5);
      float a = e*pow(vUv.y, 1.0)*0.16*(0.85 + 0.15*sin(uTime*0.7 + op.x));

  if (!navDrawer || !navPanel) return;

  navPanel.classList.remove('translate-x-full');

};
