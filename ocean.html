<body class="text-white min-h-screen selection:bg-white selection:text-black relative overflow-x-hidden m-0 p-0 font-sans">

<canvas id="c" class="fixed inset-0 w-full h-full block pointer-events-none z-0"></canvas>

<!-- Top Fixed Header Bar -->
<header class="fixed top-0 left-0 w-full z-40 px-4 sm:px-8 lg:px-12 py-4 sm:py-5 flex items-center justify-between backdrop-blur-md bg-black/25 border-b border-white/10 text-white shadow-lg pointer-events-auto">
