<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<!-- Google Fonts -->

<!-- Three.js CDN (r128) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            script: ['"Great Vibes"', 'cursive']
          }
        }
      }
    }
</script>
<style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2a1618;
    }
    .great-vibes-regular {
      font-family: "Great Vibes", cursive;
      font-weight: 400;
    }
    .glass-btn-compact {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-btn-compact:hover {
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(255, 255, 255, 0.75);
      box-shadow: 0 12px 32px rgba(255, 255, 255, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.7);
    }
</style>
</head>
<body class="text-white relative font-sans">

<!-- 3D Sunset Arch Fixed Full Screen Background -->
<div id="bg-3d-container" class="fixed inset-0 w-full h-full z-0 overflow-hidden">
  <canvas id="c" class="absolute inset-0 w-full h-full block cursor-grab active:cursor-grabbing"></canvas>
</div>

<!-- Sunset Arch Landing Viewport Section -->
<section id="landing-hero" class="fixed inset-0 z-10 w-full h-[100dvh] flex flex-col justify-between pointer-events-none" style="padding-top: max(env(safe-area-inset-top, 0px), 1.5rem); padding-bottom: max(calc(env(safe-area-inset-bottom, 0px) + 2rem), 4.25rem); padding-left: max(env(safe-area-inset-left, 0px), 1.5rem); padding-right: max(env(safe-area-inset-right, 0px), 1.5rem);">
  <!-- Top Bar / Navigation Overlay -->
  <header class="w-full flex items-center justify-between pointer-events-auto">
    <div class="flex items-center space-x-3">
      <span class="text-xs sm:text-sm font-mono uppercase tracking-[0.25em] font-semibold text-white/90 drop-shadow-md">Lively Interactive</span>
    </div>
    <div class="flex items-center">
      <button aria-label="Toggle menu" id="menu-toggle-btn" class="glass-btn-compact p-2 sm:p-2.5 rounded-full cursor-pointer focus:outline-none flex items-center justify-center" type="button">
        <div class="space-y-1">
          <span class="block w-4 sm:w-5 h-[2px] bg-white"></span>
          <span class="block w-4 sm:w-5 h-[2px] bg-white"></span>
        </div>
      </button>
    </div>
  </header>

  <!-- Bottom Floating Bar: About Us (Left) & Title (Right) -->
  <div class="w-full flex items-end justify-between gap-4 pointer-events-none">
    <!-- "About Us" Button (Bottom Left) -->
    <div class="pointer-events-auto">
      <a href="ocean.html" id="hero-know-about-us-btn" class="glass-btn-compact group relative inline-flex items-center gap-2 sm:gap-2.5 px-4 sm:px-6 py-2.5 sm:py-3 rounded-full font-mono text-[11px] sm:text-xs uppercase tracking-widest text-white font-semibold transition-all duration-300 hover:scale-105 active:scale-95 shadow-2xl cursor-pointer">
        <span>About Us</span>
        <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-white/20 flex items-center justify-center group-hover:bg-white group-hover:text-black transition-all duration-300">
          <svg class="w-2.5 h-2.5 sm:w-3 sm:h-3 transition-transform duration-300 group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M5 12h14m-7-7l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
          </svg>
        </div>
      </a>
    </div>

    <!-- Stacked Title Overlay at Bottom Right -->
    <div class="text-right select-none pointer-events-none">
      <h1 class="great-vibes-regular text-4xl sm:text-6xl lg:text-7xl text-white tracking-wide drop-shadow-[0_4px_30px_rgba(0,0,0,0.9)] leading-[0.9]">
        <span class="block">Lively</span>
        <span class="block mt-1 sm:mt-2">Interactive</span>
      </h1>
    </div>
  </div>
</section>

<script type="module" src="/src/js/landingMain.js"></script>

<!-- Navigation Menu Drawer Modal -->
<div id="nav-drawer" class="fixed inset-0 z-50 pointer-events-none opacity-0 transition-opacity duration-300 flex justify-end">
  <div id="nav-backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm cursor-pointer"></div>
  <div id="nav-panel" class="relative z-10 max-w-[85vw] sm:max-w-md w-full bg-white border-l border-black/10 h-full p-6 sm:p-8 flex flex-col justify-between transform translate-x-full transition-transform duration-300 ease-out shadow-2xl" style="padding-top: max(env(safe-area-inset-top, 0px), 1.5rem); padding-bottom: max(calc(env(safe-area-inset-bottom, 0px) + 1.25rem), 2.5rem);">
    <div>
      <div class="flex items-center justify-between pb-6 sm:pb-8 border-b border-black/10">
        <span class="font-mono text-[10px] sm:text-xs uppercase tracking-[0.25em] text-black font-bold">LIVELY INTERACTIVE</span>
        <button id="nav-close-btn" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-black/10 hover:bg-black/20 border border-black/20 text-black flex items-center justify-center transition-colors cursor-pointer" type="button" aria-label="Close menu">
          <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <nav class="mt-8 sm:mt-10 space-y-4 sm:space-y-6">
        <a href="index.html" class="group flex items-center justify-between text-lg sm:text-xl font-display font-bold text-amber-500 transition-colors">
          <span>01 // Home</span>
          <span class="text-xs font-mono text-amber-500">✦</span>
        </a>
        <a href="ocean.html" class="group flex items-center justify-between text-lg sm:text-xl font-display font-bold text-black/70 hover:text-black transition-colors">
          <span>02 // About Us</span>
          <span class="text-xs font-mono text-black group-hover:translate-x-1 transition-transform">→</span>
        </a>
        <a href="contact.html" class="group flex items-center justify-between text-lg sm:text-xl font-display font-bold text-black/70 hover:text-black transition-colors">
          <span>03 // Contact Us</span>
          <span class="text-xs font-mono text-black group-hover:translate-x-1 transition-transform">→</span>
        </a>
      </nav>
    </div>
    <div class="pt-6 sm:pt-8 border-t border-black/10 space-y-2 sm:space-y-3 font-mono text-[11px] sm:text-xs text-black/60">
      <p>IG — <a href="https://instagram.com/lively_interactive" target="_blank" rel="noopener" class="text-black hover:underline">@lively_interactive</a></p>
      <p>EMAIL — <a href="mailto:livelyinteractive@gmail.com" class="text-black hover:underline">livelyinteractive@gmail.com</a></p>
      <p>LEGAL — <a href="privacy.html" class="text-black hover:underline">Privacy Policy</a></p>
    </div>
  </div>
</div>

<script>
  const menuBtn = document.getElementById('menu-toggle-btn');
  const navDrawer = document.getElementById('nav-drawer');
  const navBackdrop = document.getElementById('nav-backdrop');
  const navPanel = document.getElementById('nav-panel');
  const navCloseBtn = document.getElementById('nav-close-btn');

  const openDrawer = () => {
    if (!navDrawer || !navPanel) return;
    navDrawer.classList.remove('pointer-events-none', 'opacity-0');
    navDrawer.classList.add('opacity-100');
    navPanel.classList.remove('translate-x-full');
  };

  const closeDrawer = () => {
    if (!navDrawer || !navPanel) return;
    navPanel.classList.add('translate-x-full');
    navDrawer.classList.remove('opacity-100');
    navDrawer.classList.add('opacity-0', 'pointer-events-none');
  };

  if (menuBtn) menuBtn.addEventListener('click', openDrawer);
  if (navCloseBtn) navCloseBtn.addEventListener('click', closeDrawer);
  if (navBackdrop) navBackdrop.addEventListener('click', closeDrawer);
</script>
</body>
</html>
